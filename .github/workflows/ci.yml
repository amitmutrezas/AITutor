name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tooling:
    name: Hooks and policy files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook tests
        run: .claude/hooks/tests/test-hooks.sh
      - name: Required files exist
        run: |
          for f in CLAUDE.md AGENTS.md REVIEW.md POLICY.md intent/INTENT.md intent/SPEC.md intent/PLAN.md; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Settings is valid JSON
        run: jq . .claude/settings.json >/dev/null

  protected-paths:
    name: Protected paths and plan gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Bootstrap: the PR that introduces the guards cannot be gated by them.
          if ! git cat-file -e "$BASE_SHA:.claude/hooks/protect-paths.sh" 2>/dev/null; then
            echo "Base has no guards yet (bootstrap PR). Skipping."; exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          protected='^(POLICY\.md|REVIEW\.md|intent/INTENT\.md|intent/SPEC\.md|\.claude/settings\.json|\.claude/hooks/|\.github/workflows/|\.github/CODEOWNERS|app/\(legal\)/|db/migrations/)'
          if echo "$changed" | grep -Eq "$protected"; then
            case ",$LABELS," in
              *,policy-approved,*) echo "Protected paths changed; label policy-approved present." ;;
              *) echo "Protected paths changed without the policy-approved label (added by Amit):"; echo "$changed" | grep -E "$protected"; exit 1 ;;
            esac
          fi
          approved='^Status:[[:space:]]*\**APPROVED'
          base_plan="$(git show "$BASE_SHA:intent/PLAN.md" 2>/dev/null || true)"
          # Changing the plan's status line to APPROVED is Amit's call: needs the label.
          if echo "$changed" | grep -qx 'intent/PLAN.md' && grep -Eq "$approved" intent/PLAN.md \
             && ! echo "$base_plan" | grep -Eq "$approved"; then
            case ",$LABELS," in
              *,policy-approved,*) echo "Plan approval PR with policy-approved label." ;;
              *) echo "intent/PLAN.md was set to APPROVED without the policy-approved label (added by Amit)."; exit 1 ;;
            esac
          fi
          # Application code is allowed only if the TRUSTED BASE plan is already approved.
          appcode='^(app/|lib/|components/|content/|scripts/|tests/|e2e/|db/|src/|public/|package\.json|next\.config)'
          if echo "$changed" | grep -Eq "$appcode" && ! echo "$base_plan" | grep -Eq "$approved"; then
            echo "Application code changed but intent/PLAN.md is not APPROVED on the base branch."; exit 1
          fi

  app:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect app
        id: detect
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No package.json yet (pre-M0). App checks skipped."; fi
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.present == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.detect.outputs.present == 'true'
        run: pnpm typecheck
      - if: steps.detect.outputs.present == 'true'
        run: pnpm lint
      - if: steps.detect.outputs.present == 'true'
        run: pnpm test
      - name: Verify exercises
        if: steps.detect.outputs.present == 'true'
        run: pnpm run --if-present exercises:verify
      - name: Product evals (leak check)
        if: steps.detect.outputs.present == 'true'
        run: pnpm run --if-present evals:product
      - if: steps.detect.outputs.present == 'true'
        run: pnpm build
